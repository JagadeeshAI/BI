# configs/cifar100_clpu.yaml

# === Dataset & Scenario ===
dataset: cifar100
scenario: class
image_size: 224                   # ViT model input size

# === Training Hyperparameters ===
batch_size: 32
n_epochs: 20
lr: 0.001
momentum: 0.9
weight_decay: 0.0005              # Use decimal for YAML safety

# === Replay Memory & CLPU Loss ===
mem_batch_size: 64                # Batch size used for memory replay/distillation
memory_size: 2000                 # Total memory size for DER++
alpha: 0.5                        # Distillation loss weight
beta: 1.0                         # Supervised loss weight

# === Model Architecture ===
use_pretrain: true                # Load pretrained weights from timm (ViT)
model_name: deit_tiny_patch16_224 # TIMM model string
embed_dim: 192                    # ViT tiny: must match architecture
n_tasks: 100                      # 100 classes; one per task here
class_per_task: 1                 # 1 class per task (fully incremental)
device: cuda                      # or "cpu"

# === ViT Dropout & Regularization ===
drop_rate: 0.1
drop_path_rate: 0.1
attn_drop_rate: 0.1

# === LoRA (Low-Rank Adaptation) ===
use_lora: false
lora_rank: 8

# === Other Settings ===
save_dir: ./clpu_steps            # Directory to save checkpoints
num_workers: 4                    # DataLoader worker threads
